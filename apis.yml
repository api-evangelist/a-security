aid: a-security
name: A Security
description: >-
  A Security (Ⓐ) is an Israeli-founded cybersecurity company building an
  autonomous offensive security and remediation platform. The product
  continuously discovers real attack paths inside an organization, validates
  whether they can actually be exploited by following each path until it proves
  what is truly exploitable, and then helps close those gaps before adversaries
  chain vulnerabilities into a breach. Positioned for organizations where
  failure is not an option, A Security is designed to operate at machine speed
  to keep pace with AI-enabled attackers. The company emerged from stealth in
  June 2026 with $37M in funding led by Lightspeed Venture Partners and
  Cyberstarts, with participation from Cerca Partners and angel investors
  including Wiz CEO Assaf Rappaport and Cyera CEO Yotam Segev. It was founded by
  Yossi Torati (CEO), Omer Gull (CPO), and Yuval Itzchakov (CTO), veterans of
  Check Point, Hunters, Sygnia, and the IDF's Unit 8200. A Security maintains
  SOC 2 and ISO 27001 certifications.
